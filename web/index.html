<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <!-- Bookmarked sites never learn this server's host name. -->
    <meta name="referrer" content="no-referrer" />
    <!--space-theme-->
    <title>Starbook</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="bar">
      <!-- The other spaces stay out of sight until the switcher is opened, e.g. while sharing a screen. -->
      <details id="switcher" class="switcher">
        <summary><h1 id="space-name"></h1></summary>
        <nav id="spaces" class="spaces" aria-label="Spaces"></nav>
      </details>
      <nav id="tabs" class="tabs" aria-label="Tabs"></nav>
      <!-- Searches every tab of the space; "/" focuses it. -->
      <div class="search" role="search">
        <input
          id="search"
          type="search"
          placeholder="Search…"
          title="Search this space ( / )"
          aria-label="Search bookmarks in this space"
          aria-controls="search-results"
          aria-expanded="false"
          role="combobox"
          autocomplete="off"
          spellcheck="false"
        />
        <div id="search-results" class="search-results" role="listbox" hidden></div>
      </div>
      <!-- Shown only in edit mode; editing is started from the space menu. -->
      <button id="edit-toggle" class="edit-toggle" type="button">Done</button>
    </header>
    <main id="content"></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <!--space-data-->
  </body>
</html>
